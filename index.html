<!DOCTYPE html>
<html lang="es" class="dark">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Estrategia Roberto Luna</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: {
              sans: ['Montserrat', 'sans-serif'],
              serif: ['Playfair Display', 'serif'],
            },
            colors: {
              luxury: {
                black: '#09090b', // Zinc 950
                dark: '#18181b',  // Zinc 900
                card: '#27272a',  // Zinc 800
                gold: '#d4af37',  // Classic Gold
                light: '#f4f4f5', // Zinc 100
              }
            }
          }
        }
      }
    </script>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@100;200;300;400;500;600;700;800;900&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">

    <!-- Dependencies (React, Babel, Framer Motion, Lucide) -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/framer-motion@10.16.4/dist/framer-motion.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
      body {
        font-family: 'Montserrat', sans-serif;
        background-color: #09090b;
        color: #f4f4f5;
        overflow-x: hidden; /* Prevent horizontal scroll */
      }
      /* Hide scrollbar but allow functionality */
      ::-webkit-scrollbar {
        width: 4px;
        height: 4px;
        background: #09090b;
      }
      ::-webkit-scrollbar-thumb {
        background: #27272a; 
        border-radius: 4px;
      }
      .custom-scrollbar::-webkit-scrollbar {
        width: 4px;
      }
      .custom-scrollbar::-webkit-scrollbar-track {
        background: rgba(255, 255, 255, 0.05); 
      }
      .custom-scrollbar::-webkit-scrollbar-thumb {
        background: rgba(212, 175, 55, 0.3); 
        border-radius: 10px;
      }
      .glass-panel {
        background: rgba(255, 255, 255, 0.03);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        border: 1px solid rgba(255, 255, 255, 0.05);
      }
      .perspective-1000 {
        perspective: 1000px;
      }
    </style>
<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@^19.2.4",
    "react-dom/": "https://esm.sh/react-dom@^19.2.4/",
    "react/": "https://esm.sh/react@^19.2.4/",
    "framer-motion": "https://esm.sh/framer-motion@^12.34.1",
    "lucide-react": "https://esm.sh/lucide-react@^0.574.0"
  }
}
</script>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel" data-presets="react,typescript">
        const { useState, useEffect, useRef } = React;
        const { motion, AnimatePresence } = window.Motion;

        // --- LUCIDE ICONS WRAPPER ---
        const LucideIcons = Object.fromEntries(
            Object.entries(lucide.icons).map(([key, iconNode]) => {
                const PascalName = key.charAt(0).toUpperCase() + key.slice(1);
                const Component = ({ color = "currentColor", size = 24, strokeWidth = 2, className, ...props }) => {
                    return React.createElement(
                        "svg",
                        {
                            ...props,
                            width: size,
                            height: size,
                            stroke: color,
                            strokeWidth: strokeWidth,
                            className: className,
                            viewBox: "0 0 24 24",
                            fill: "none",
                            strokeLinecap: "round",
                            strokeLinejoin: "round",
                            xmlns: "http://www.w3.org/2000/svg"
                        },
                        ...iconNode.map(([tag, attrs]) => React.createElement(tag, attrs))
                    );
                };
                return [PascalName, Component];
            })
        );
        
        const { 
            ChevronDown, ChevronUp, ArrowRight, PenTool, Sword, Globe, BookOpen, 
            Mail, Mic, MessageSquare, Video, Database, Layers, Users, Zap, 
            ChevronRight, Brain, Target, RefreshCcw, Copy, Check, Thermometer, 
            Activity, Terminal, Feather 
        } = LucideIcons;


        // --- TYPES ---
        
        enum Market {
          LATAM = 'LATAM',
          EN = 'EN',
          INDIA = 'INDIA',
          CHINA = 'CHINA',
        }

        // --- HOOKS ---
        
        function useIsMobile() {
            const [isMobile, setIsMobile] = useState(false);
            useEffect(() => {
                const check = () => setIsMobile(window.innerWidth < 768);
                check();
                window.addEventListener('resize', check);
                return () => window.removeEventListener('resize', check);
            }, []);
            return isMobile;
        }

        // --- COMPONENTS ---

        const SlideContainer = ({ children, isActive, isMobile, className = "" }) => {
          if (isMobile) {
              return (
                <div className={`relative w-full min-h-screen flex flex-col items-center justify-center py-20 px-6 border-b border-zinc-900 bg-luxury-black ${className}`}>
                     {/* Background Texture Mobile */}
                    <div className="absolute inset-0 opacity-[0.03] pointer-events-none z-0 mix-blend-overlay" 
                         style={{backgroundImage: `url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E")`}} 
                    />
                    <div className="relative z-10 w-full flex flex-col items-center justify-center">
                        {children}
                    </div>
                </div>
              );
          }

          // Desktop Logic
          return (
            <AnimatePresence mode='wait'>
              {isActive && (
                <motion.div
                  initial={{ opacity: 0, scale: 0.98, filter: "blur(4px)" }}
                  animate={{ opacity: 1, scale: 1, filter: "blur(0px)" }}
                  exit={{ opacity: 0, scale: 1.02, filter: "blur(4px)" }}
                  transition={{ duration: 0.7, ease: [0.22, 1, 0.36, 1] }}
                  className={`absolute inset-0 w-full h-full flex flex-col items-center justify-center p-6 md:p-12 overflow-hidden bg-luxury-black text-white ${className}`}
                >
                  {/* Subtle Noise Texture Overlay */}
                  <div className="absolute inset-0 opacity-[0.03] pointer-events-none z-0 mix-blend-overlay" 
                       style={{backgroundImage: `url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E")`}} 
                  />
                  
                  <div className="relative z-10 w-full h-full flex flex-col items-center justify-center">
                    {children}
                  </div>
                </motion.div>
              )}
            </AnimatePresence>
          );
        };

        // --- SLIDES ---

        const IntroSlide = ({ isActive, isMobile, onNext }) => {
          return (
            <SlideContainer isActive={isActive} isMobile={isMobile}>
              <div className="max-w-7xl w-full flex flex-col items-start justify-center h-full relative">
                
                {/* Top Label */}
                <div className="flex items-center gap-4 mb-8">
                  <div className="h-[1px] w-12 bg-luxury-gold/50"></div>
                  <span className="text-xs font-bold tracking-[0.3em] uppercase text-luxury-gold">Estrategia de Marca</span>
                </div>

                {/* Main Title */}
                <div className="relative z-10">
                  <h1 className="text-5xl md:text-9xl font-black tracking-tighter leading-[0.9] mb-4 text-transparent bg-clip-text bg-gradient-to-br from-white via-zinc-200 to-zinc-600">
                    LA PLUMA
                  </h1>
                  <h1 className="text-5xl md:text-9xl font-thin tracking-tighter leading-[0.9] text-white flex flex-wrap items-center gap-2 md:gap-4">
                    <span className="font-serif italic text-4xl md:text-7xl opacity-50">de</span> LUNA
                  </h1>
                </div>

                {/* Subtitle / Description */}
                <div className="mt-12 max-w-xl border-l border-zinc-800 pl-8 ml-2">
                  <p className="text-base md:text-xl font-light text-zinc-400 leading-relaxed">
                    Cómo convertir <strong className="text-white font-semibold">Negociando Bonito</strong> en un estándar cultural sin depender del performance constante.
                  </p>
                  <p className="text-sm mt-4 text-zinc-500 uppercase tracking-widest">
                    Brand Strategy Deck v1.0
                  </p>
                </div>

                {/* Decorative Circle (Desktop Only to prevent Mobile overlap issues) */}
                {!isMobile && (
                  <>
                    <div className="absolute right-0 top-1/2 -translate-y-1/2 w-[300px] h-[300px] md:w-[600px] md:h-[600px] rounded-full border border-zinc-800 opacity-20 pointer-events-none" />
                    <div className="absolute right-20 top-1/2 -translate-y-1/2 w-[200px] h-[200px] md:w-[400px] md:h-[400px] rounded-full bg-gradient-to-tr from-luxury-gold/10 to-transparent blur-3xl pointer-events-none" />
                  </>
                )}

                {!isMobile && (
                  <button 
                    onClick={onNext}
                    className="absolute bottom-12 right-0 group flex items-center gap-4 text-sm font-bold tracking-widest uppercase text-white hover:text-luxury-gold transition-colors"
                  >
                    Iniciar
                    <div className="p-3 border border-zinc-800 rounded-full group-hover:border-luxury-gold transition-colors">
                       <ChevronDown size={20} />
                    </div>
                  </button>
                )}
              </div>
            </SlideContainer>
          );
        };

        const BigIdeaSlide = ({ isActive, isMobile }) => {
          return (
            <SlideContainer isActive={isActive} isMobile={isMobile}>
              <div className="max-w-7xl w-full grid grid-cols-1 md:grid-cols-2 gap-12 md:gap-16 items-center">
                
                {/* Text Side */}
                <div className="space-y-8 md:space-y-10 order-2 md:order-1">
                  <div className="space-y-2">
                    <span className="text-luxury-gold text-xs font-bold tracking-widest uppercase">El Core Concept</span>
                    <h2 className="text-4xl md:text-6xl font-bold leading-tight tracking-tight">
                      Negociar es <span className="font-serif italic font-normal text-zinc-400">arte</span>, <br/>
                      no guerra.
                    </h2>
                  </div>
                  
                  <p className="text-base md:text-lg text-zinc-400 font-light leading-relaxed">
                    El mercado está saturado de "Lobos de Wall Street". Tu propuesta es disruptiva por su elegancia: 
                    planteas que la <span className="text-white font-medium">escucha y la empatía</span> son armas más letales que la agresión.
                  </p>

                  <div className="glass-panel p-6 rounded-r-2xl border-l-4 border-l-luxury-gold">
                    <h3 className="text-lg font-bold text-white mb-2">Traducción Estratégica</h3>
                    <p className="text-zinc-400 text-sm">
                      Construir una <strong>biblioteca viva de herramientas</strong>. No buscamos views vacíos, buscamos que la gente guarde el post porque lo necesita para sobrevivir el lunes en la oficina.
                    </p>
                  </div>
                </div>

                {/* Visual Side */}
                <div className={`relative w-full glass-panel rounded-2xl flex flex-col items-center justify-center p-8 overflow-hidden order-1 md:order-2 ${isMobile ? 'h-[350px]' : 'h-[500px]'}`}>
                  
                  {/* Background Gradient */}
                  <div className="absolute inset-0 bg-gradient-to-b from-transparent via-zinc-900/50 to-zinc-950 opacity-80" />
                  
                  <div className="relative z-10 flex items-center justify-around w-full">
                    
                    {/* The Old Way */}
                    <div className="flex flex-col items-center group opacity-60">
                      <div className="w-20 h-20 md:w-24 md:h-24 rounded-full border border-zinc-800 bg-zinc-900 flex items-center justify-center mb-6">
                        <Sword size={24} className="text-zinc-600" />
                      </div>
                      <p className="text-zinc-500 font-bold uppercase tracking-widest text-xs md:text-sm line-through decoration-zinc-700">Guerra</p>
                    </div>

                    <div className="h-24 w-[1px] bg-zinc-800"></div>

                    {/* The New Way */}
                    <div className="flex flex-col items-center scale-110">
                      <div className="w-24 h-24 md:w-32 md:h-32 rounded-full bg-gradient-to-tr from-luxury-gold to-yellow-200 shadow-[0_0_30px_rgba(212,175,55,0.3)] flex items-center justify-center mb-6 text-black">
                        <PenTool size={32} strokeWidth={1.5} className="md:w-10 md:h-10" />
                      </div>
                      <p className="text-white font-serif italic text-xl md:text-2xl">Arte & Cuidado</p>
                    </div>
                  </div>

                  <div className="mt-12 text-center max-w-xs relative z-10">
                    <p className="text-[10px] md:text-xs text-zinc-500 font-mono border border-zinc-800 rounded-full px-4 py-2 bg-zinc-950/50">
                      return new Standard("Negociando Bonito");
                    </p>
                  </div>

                </div>

              </div>
            </SlideContainer>
          );
        };

        const BrandSlide = ({ isActive, isMobile }) => {
          const [activeBrand, setActiveBrand] = useState('ES');

          return (
            <SlideContainer isActive={isActive} isMobile={isMobile}>
              <div className="max-w-6xl w-full flex flex-col items-center">
                
                <div className="text-center mb-12">
                  <h2 className="text-3xl md:text-5xl font-bold mb-4 tracking-tight">Arquitectura de Marca</h2>
                  <p className="text-zinc-400 font-light max-w-2xl mx-auto text-base md:text-lg">
                    Separamos al autor del sello. Creamos una entidad editorial que escala sola.
                  </p>
                </div>

                {/* Toggle */}
                <div className="flex bg-zinc-900/50 p-1 rounded-full border border-zinc-800 mb-12 backdrop-blur-sm">
                    <button 
                        onClick={() => setActiveBrand('ES')}
                        className={`px-6 md:px-8 py-2 md:py-3 rounded-full text-xs md:text-sm font-bold tracking-widest transition-all ${activeBrand === 'ES' ? 'bg-zinc-100 text-black shadow-lg' : 'text-zinc-500 hover:text-zinc-300'}`}
                    >
                        LATAM
                    </button>
                    <button 
                        onClick={() => setActiveBrand('EN')}
                        className={`px-6 md:px-8 py-2 md:py-3 rounded-full text-xs md:text-sm font-bold tracking-widest transition-all ${activeBrand === 'EN' ? 'bg-zinc-100 text-black shadow-lg' : 'text-zinc-500 hover:text-zinc-300'}`}
                    >
                        GLOBAL
                    </button>
                </div>

                {/* 3D Card Area - Simplified for Mobile */}
                <div className={`relative w-full max-w-xl ${isMobile ? 'h-auto min-h-[300px]' : 'h-[350px] perspective-1000'}`}>
                   <AnimatePresence mode='wait'>
                     <motion.div
                        key={activeBrand}
                        initial={isMobile ? { opacity: 0 } : { rotateY: 90, opacity: 0 }}
                        animate={isMobile ? { opacity: 1 } : { rotateY: 0, opacity: 1 }}
                        exit={isMobile ? { opacity: 0 } : { rotateY: -90, opacity: 0 }}
                        transition={{ duration: 0.6, ease: "easeOut" }}
                        className={`w-full h-full ${isMobile ? 'relative' : 'absolute inset-0'} glass-panel rounded-3xl border border-zinc-700/50 flex flex-col items-center justify-center p-8 md:p-10 text-center shadow-2xl bg-gradient-to-b from-zinc-800/50 to-black`}
                     >
                        <div className="absolute top-6 right-6 opacity-20">
                            {activeBrand === 'ES' ? <BookOpen size={isMobile ? 30 : 40} /> : <Globe size={isMobile ? 30 : 40} />}
                        </div>

                        <h3 className="font-serif italic text-5xl md:text-7xl mb-4 text-white bg-clip-text">
                            {activeBrand === 'ES' ? 'La Pluma' : 'Luna Ink'}
                        </h3>
                        
                        <div className="w-12 h-[2px] bg-luxury-gold my-6"></div>

                        <p className="text-[10px] md:text-xs font-bold tracking-[0.2em] uppercase text-zinc-500 mb-6">
                            {activeBrand === 'ES' ? 'by Roberto Luna' : 'International Edition'}
                        </p>
                        <div className="text-base md:text-lg text-zinc-300 leading-relaxed font-light">
                            {activeBrand === 'ES' 
                                ? '"Una línea editorial profunda que deja clara la autoría, sin obligarte a ser un showman perpetuo."'
                                : '"Breve, táctico y listo para escalar. La firma secundaria para mercados de alto contexto."'
                            }
                        </div>
                     </motion.div>
                   </AnimatePresence>
                </div>

                {/* Footer Info */}
                <div className="mt-16 grid grid-cols-1 md:grid-cols-2 gap-6 w-full max-w-4xl">
                     <div className="glass-panel p-6 rounded-xl border-l-2 border-zinc-600 hover:border-luxury-gold transition-colors group">
                        <h4 className="font-bold mb-2 text-xs uppercase tracking-widest text-zinc-500 group-hover:text-white">Formato</h4>
                        <p className="text-sm text-zinc-400">Pilares exportables vs Clips infinitos. Empaquetamos sabiduría, no tendencias.</p>
                     </div>
                     <div className="glass-panel p-6 rounded-xl border-l-2 border-zinc-600 hover:border-luxury-gold transition-colors group">
                        <h4 className="font-bold mb-2 text-xs uppercase tracking-widest text-zinc-500 group-hover:text-white">Video Strategy</h4>
                        <p className="text-sm text-zinc-400">1-3 min por capítulo. Scripts visuales y voz en off. No requiere tu cara 24/7.</p>
                     </div>
                </div>

              </div>
            </SlideContainer>
          );
        };

        const SystemSlide = ({ isActive, isMobile }) => {
          return (
            <SlideContainer isActive={isActive} isMobile={isMobile}>
              <div className="max-w-7xl w-full h-full flex flex-col justify-center items-center">
                
                <div className="text-center mb-10 md:mb-16 relative z-10">
                  <h2 className="text-3xl md:text-4xl font-bold mb-2">Sistema Nervioso Central</h2>
                  <p className="text-zinc-500 font-mono text-xs md:text-sm">Repositorio Maestro v1.0 -> Substack Core</p>
                </div>

                <div className={`relative w-full max-w-4xl flex items-center justify-center ${isMobile ? 'flex-col gap-8 h-auto' : 'h-[500px]'}`}>
                  
                  {/* Orbital Rings - Desktop Only */}
                  {!isMobile && (
                    <>
                        <div className="absolute w-[300px] h-[300px] rounded-full border border-zinc-800/50 animate-[spin_20s_linear_infinite]" />
                        <div className="absolute w-[500px] h-[500px] rounded-full border border-zinc-900 border-dashed animate-[spin_40s_linear_infinite_reverse]" />
                        <svg className="absolute inset-0 w-full h-full pointer-events-none opacity-20">
                            <line x1="50%" y1="50%" x2="20%" y2="20%" stroke="white" strokeWidth="1" />
                            <line x1="50%" y1="50%" x2="80%" y2="20%" stroke="white" strokeWidth="1" />
                            <line x1="50%" y1="50%" x2="20%" y2="80%" stroke="white" strokeWidth="1" />
                            <line x1="50%" y1="50%" x2="80%" y2="80%" stroke="white" strokeWidth="1" />
                        </svg>
                    </>
                  )}

                  {/* Core Nucleus */}
                  <div className={`relative z-20 rounded-full bg-black border border-zinc-700 shadow-[0_0_50px_rgba(255,255,255,0.1)] flex flex-col items-center justify-center z-10 ${isMobile ? 'w-32 h-32 mb-4' : 'w-40 h-40'}`}>
                    <Database size={isMobile ? 24 : 32} className="text-luxury-gold mb-2" />
                    <span className="font-bold text-white tracking-widest text-sm">CORE</span>
                    <span className="text-[10px] text-zinc-500 uppercase mt-1">Substack</span>
                  </div>

                  {/* Mobile Stacked View vs Desktop Absolute */}
                  {isMobile ? (
                      <div className="w-full grid grid-cols-1 gap-4">
                           {/* Cards Stacked for Mobile */}
                           {[
                               { color: 'emerald', icon: Mail, title: 'Distribución', text: 'Formato largo, ensayos y guías profundas.' },
                               { color: 'purple', icon: Mic, title: 'Audio', text: 'La voz del libro. Contenido íntimo.' },
                               { color: 'blue', icon: MessageSquare, title: 'Micro', text: 'Substack Notes. Micro-scripts diarios.' },
                               { color: 'red', icon: Video, title: 'Social', text: 'Shorts, quotes, carruseles.' },
                           ].map((item, i) => (
                               <div key={i} className={`glass-panel p-4 rounded-lg border-l-2 border-${item.color}-500 w-full`}>
                                   <div className={`flex items-center gap-2 mb-2 text-${item.color}-400`}>
                                       <item.icon size={16} /> <span className="text-xs font-bold uppercase">{item.title}</span>
                                   </div>
                                   <p className="text-xs text-zinc-400 leading-relaxed">{item.text}</p>
                               </div>
                           ))}
                      </div>
                  ) : (
                      <>
                          {/* Top Left */}
                          <motion.div initial={{opacity:0, x: -20, y:-20}} animate={{opacity:1, x:0, y:0}} transition={{delay: 0.2}} className="absolute top-[10%] left-[10%] md:left-[20%] glass-panel p-4 rounded-lg border-l-2 border-emerald-500 w-48 hover:bg-zinc-900 transition-colors cursor-default">
                             <div className="flex items-center gap-2 mb-2 text-emerald-400">
                                <Mail size={16} /> <span className="text-xs font-bold uppercase">Distribución</span>
                             </div>
                             <p className="text-[10px] text-zinc-400 leading-relaxed">Formato largo, ensayos y guías profundas. La bandeja de entrada es sagrada.</p>
                          </motion.div>

                          {/* Top Right */}
                          <motion.div initial={{opacity:0, x: 20, y:-20}} animate={{opacity:1, x:0, y:0}} transition={{delay: 0.3}} className="absolute top-[10%] right-[10%] md:right-[20%] glass-panel p-4 rounded-lg border-l-2 border-purple-500 w-48 hover:bg-zinc-900 transition-colors cursor-default">
                             <div className="flex items-center gap-2 mb-2 text-purple-400">
                                <Mic size={16} /> <span className="text-xs font-bold uppercase">Audio</span>
                             </div>
                             <p className="text-[10px] text-zinc-400 leading-relaxed">La voz del libro. Contenido íntimo y "premium". Fragmentos de realidad.</p>
                          </motion.div>

                          {/* Bottom Left */}
                          <motion.div initial={{opacity:0, x: -20, y:20}} animate={{opacity:1, x:0, y:0}} transition={{delay: 0.4}} className="absolute bottom-[10%] left-[10%] md:left-[20%] glass-panel p-4 rounded-lg border-l-2 border-blue-500 w-48 hover:bg-zinc-900 transition-colors cursor-default">
                             <div className="flex items-center gap-2 mb-2 text-blue-400">
                                <MessageSquare size={16} /> <span className="text-xs font-bold uppercase">Micro</span>
                             </div>
                             <p className="text-[10px] text-zinc-400 leading-relaxed">Substack Notes. Micro-scripts diarios y preguntas a la comunidad.</p>
                          </motion.div>

                          {/* Bottom Right */}
                          <motion.div initial={{opacity:0, x: 20, y:20}} animate={{opacity:1, x:0, y:0}} transition={{delay: 0.5}} className="absolute bottom-[10%] right-[10%] md:right-[20%] glass-panel p-4 rounded-lg border-l-2 border-red-500 w-48 hover:bg-zinc-900 transition-colors cursor-default">
                             <div className="flex items-center gap-2 mb-2 text-red-400">
                                <Video size={16} /> <span className="text-xs font-bold uppercase">Social</span>

          const [currentSlide, setCurrentSlide] = useState(0);
          const [isScrolling, setIsScrolling] = useState(false);
          const isMobile = useIsMobile();

          const nextSlide = () => {
            if (currentSlide < SLIDES.length - 1) {
              setCurrentSlide(prev => prev + 1);
            }
          };

          const prevSlide = () => {
            if (currentSlide > 0) {
              setCurrentSlide(prev => prev - 1);
            }
          };

          // Desktop Scroll Handler
          useEffect(() => {
            if (isMobile) return; // Disable custom scroll on mobile

            const handleWheel = (e) => {
              if (isScrolling) return;
              
              if (e.deltaY > 50) {
                setIsScrolling(true);
                nextSlide();
                setTimeout(() => setIsScrolling(false), 800);
              } else if (e.deltaY < -50) {
                setIsScrolling(true);
                prevSlide();
                setTimeout(() => setIsScrolling(false), 800);
              }
            };

            const handleKeyDown = (e) => {
               if (e.key === 'ArrowDown' || e.key === 'ArrowRight') {
                   nextSlide();
               } else if (e.key === 'ArrowUp' || e.key === 'ArrowLeft') {
                   prevSlide();
               }
            };

            window.addEventListener('wheel', handleWheel);
            window.addEventListener('keydown', handleKeyDown);

            return () => {
              window.removeEventListener('wheel', handleWheel);
              window.removeEventListener('keydown', handleKeyDown);
            };
          }, [currentSlide, isScrolling, isMobile]);

          // --- MOBILE RENDER (Continuous Scroll) ---
          if (isMobile) {
              return (

                          onNext={() => {}}

              );

            <div className="relative w-screen h-screen overflow-hidden bg-luxury-black text-white selection:bg-luxury-gold selection:text-black">
              
              {/* Slides */}
              {SLIDES.map((SlideComponent, index) => (
                <SlideComponent
                  key={index}
                  isActive={currentSlide === index}
                  isMobile={false}
                  onNext={nextSlide}
                  onPrev={prevSlide}
                />
              ))}

              {/* Navigation UI */}
              <div className="fixed right-6 top-1/2 -translate-y-1/2 z-50 flex flex-col gap-4">
                {SLIDES.map((_, index) => (
                  <button
                    key={index}
                    onClick={() => setCurrentSlide(index)}
                    className={`w-2 h-2 rounded-full transition-all duration-500 border border-zinc-600 ${
                      currentSlide === index 
                        ? 'bg-white scale-150 border-white' 
                        : 'bg-transparent hover:bg-zinc-700'
                    }`}
                    aria-label={`Go to slide ${index + 1}`}
                  />
                ))}
              </div>

              {/* Progress Bar */}
              <div className="fixed top-0 left-0 w-full h-[2px] bg-zinc-900 z-50">
                <div 
                  className="h-full bg-luxury-gold shadow-[0_0_10px_#d4af37] transition-all duration-500 ease-out"
                  style={{ width: `${((currentSlide + 1) / SLIDES.length) * 100}%` }}
                />
              </div>

            </div>
          );
        };
